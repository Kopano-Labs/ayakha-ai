name: Prototype offline tests
on:
  push:
    branches: [main, prototype/voice-solidworks-pipeline, fix/ledger-verification]
  pull_request:
    branches: [main, prototype/voice-solidworks-pipeline]
permissions:
  contents: read
jobs:
  offline-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototype/requirements-test.txt
      - run: python -m pytest prototype/tests -q
      - run: python -m compileall -q prototype
